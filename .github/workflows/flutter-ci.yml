name: Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  customer-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve customer app dependencies
        run: flutter pub get
      - name: Analyze customer app
        run: flutter analyze
      - name: Test customer app
        run: flutter test

  driver-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: driver_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve driver app dependencies
        run: flutter pub get
      - name: Analyze driver app
        run: flutter analyze
      - name: Test driver app
        run: flutter test
