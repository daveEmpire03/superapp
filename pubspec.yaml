name: bokku_mart
description: "Bokku Mart - Nigeria's favorite supermarket & grocery mobile app built with Riverpod Clean Architecture, GoRouter, and Dio."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Architecture & State Management
  flutter_riverpod: ^3.4.3
  equatable: ^2.0.5
  get_it: ^7.7.0

  # Navigation & Routing
  go_router: ^14.2.0

  # Networking & HTTP
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.4.0

  # Persistence & Caching
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.4

  # UI, Icons & Animations
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  shimmer: ^3.0.0
  badges: ^3.1.2

  # Location
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
